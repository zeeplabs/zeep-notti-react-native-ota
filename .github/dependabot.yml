version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "typescript"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directories:
      - "/packages/react-native-notti-ota/android"
      - "/packages/react-native-notti-ota-expo/android"
      - "/example-bare-083/android"
      - "/example-bare-088/android"
    schedule:
      interval: "weekly"
