name: 🐛 Bug report
description: Report a reproducible bug or regression in this library.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        # Bug report

        👋 Hi!

        **Please fill the following carefully before opening a new issue ❗**
        *(Your issue may be closed if it doesn't provide the required pieces of information)*

        **Security vulnerabilities must not be reported here.** See [SECURITY.md](https://github.com/zeeplabs/zeep-notti-react-native-ota/security/policy).
  - type: checkboxes
    attributes:
      label: Before submitting a new issue
      description: Please perform simple checks first.
      options:
        - label: I tested using the latest version of the library, as the bug might be already fixed.
          required: true
        - label: I tested using a [supported version](https://github.com/reactwg/react-native-releases/blob/main/docs/support.md) of react native.
          required: true
        - label: I checked for possible duplicate issues, with possible answers.
          required: true
        - label: I removed signing keys, client keys, tokens and user data from everything I pasted below.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: |
        Provide a clear and concise description of what the bug is.
        If needed, you can also provide other samples: error messages / stack traces, screenshots, gifs, etc.
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: Library version
      description: Version of `react-native-notti-ota` (and `react-native-notti-ota-expo`, if used).
      placeholder: "x.x.x"
    validations:
      required: true
  - type: input
    id: rn-expo-version
    attributes:
      label: React Native / Expo SDK version
      placeholder: "React Native 0.83.x / Expo SDK 55"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Both
    validations:
      required: true
  - type: dropdown
    id: project-type
    attributes:
      label: Project type
      options:
        - Bare React Native
        - Expo (prebuild / development build)
    validations:
      required: true
  - type: dropdown
    id: bundle-source
    attributes:
      label: Bundle running when the bug happens
      description: Was the app running a downloaded Live update or the bundle embedded in the binary?
      options:
        - Live update (downloaded)
        - Embedded bundle
        - Not sure
    validations:
      required: true
  - type: textarea
    id: react-native-info
    attributes:
      label: Environment info
      description: Run `react-native info` in your terminal and paste the results here.
      render: shell
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: |
        You must provide a clear list of steps and code to reproduce the problem.
        Redact signing keys, client keys, tokens and user data.
      value: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: reproducible-example
    attributes:
      label: Reproducible example repository
      description: Please provide a link to a repository on GitHub with a reproducible example.
    validations:
      required: true
