buildscript {
  ext.NottiOta = [
    kotlinVersion: "2.1.20",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return NottiOta[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.12.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.notti.ota"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  testOptions {
    unitTests.includeAndroidResources = true
  }

  sourceSets {
    test {
      // The example apps link this package through node_modules; resolve the symlink to reach the repo root.
      resources.srcDir new File(projectDir.canonicalFile, "../../../fixtures")
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"

  testImplementation "junit:junit:4.13.2"
  testImplementation "org.robolectric:robolectric:4.18.1"
  testImplementation "androidx.test:core:1.6.1"
  // The Android unit-test stub of org.json throws "not mocked" outside Robolectric.
  testImplementation "org.json:json:20260814"
  testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
}
